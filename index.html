<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AstraVale Globe</title>
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; }
    video { display:block; width:100%; height:100%; object-fit:contain; }
    .play-panel {
      position:absolute; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:12px; padding:16px;
      color:#EEF2F4; text-align:center;
      font:16px/1.4 'Segoe UI',Arial,sans-serif;
      background:rgba(0,0,0,.25);
    }
    [hidden] { display:none !important; }
    button {
      padding:12px 24px; min-height:44px; border:1px solid #A6ADB1;
      border-radius:4px; background:#E5E8E9; color:#1B2C35;
      font:600 16px/1.4 'Segoe UI',Arial,sans-serif; cursor:pointer;
    }
    button:hover { background:#F5F7F8; }
    button:focus-visible { outline:3px solid #91BBC8; outline-offset:4px; }
    p { margin:0; max-width:30em; }
  </style>
</head>
<body>
  <video id="globe" autoplay muted loop playsinline webkit-playsinline preload="auto"
    aria-label="Rotating globe showing AstraVale facilities"></video>
  <div id="play-panel" class="play-panel" hidden>
    <button id="play" type="button">Play globe</button>
    <p id="status" role="status" aria-live="polite"></p>
  </div>
  <noscript>
    <style>#globe { display:none; }</style>
    <video src="./globe-mobile.mp4" autoplay muted loop playsinline controls
      aria-label="Rotating globe showing AstraVale facilities"></video>
  </noscript>
  <script>
    (() => {
      const video = document.getElementById('globe');
      const panel = document.getElementById('play-panel');
      const button = document.getElementById('play');
      const status = document.getElementById('status');
      const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
        || (/Macintosh/i.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
      let compatible = mobile;
      let failed = false;
      let loadingTimer;

      function prompt(message) {
        status.textContent = message;
        panel.hidden = false;
      }

      function play() {
        // Set both the HTML attributes and DOM properties before playback.
        video.defaultMuted = true;
        video.muted = true;
        video.playsInline = true;
        const attempt = video.play();
        if (attempt) attempt.catch(error => {
          if (error.name === 'NotAllowedError') prompt('Tap to start the globe.');
          // Loading and decoder failures are handled by the media error event.
        });
      }

      function load() {
        failed = false;
        video.src = compatible ? './globe-mobile.mp4' : './globe.mp4';
        video.load();
        clearTimeout(loadingTimer);
        loadingTimer = setTimeout(() => {
          if (video.paused) prompt('Tap to start the globe.');
        }, 5000);
        play();
      }

      video.addEventListener('playing', () => {
        clearTimeout(loadingTimer);
        panel.hidden = true;
        status.textContent = '';
      });
      video.addEventListener('error', () => {
        clearTimeout(loadingTimer);
        // Keep the original on desktop, but recover with the compatible copy
        // if a desktop browser cannot decode the original either.
        if (!compatible) { compatible = true; load(); return; }
        failed = true;
        prompt('The video could not load. Check your connection and tap to retry.');
      });
      video.addEventListener('pause', () => {
        if (!document.hidden && video.readyState >= 2 && !failed) {
          prompt('Tap to resume the globe.');
        }
      });
      button.addEventListener('click', () => { if (failed) load(); else play(); });
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && !failed) play();
      });
      window.addEventListener('pageshow', () => { if (!failed) play(); });
      load();
    })();
  </script>
</body>
</html>
